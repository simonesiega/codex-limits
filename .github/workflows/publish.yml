name: Publish

# Publish from a GitHub release or an explicitly requested version-tag workflow run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 1.2.3)
        required: true
        type: string

# Give release preflight only read access; validation and publishing request OIDC per job.
permissions:
  contents: read

# Never allow two npm publication attempts to overlap.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # Fail fast on reused versions or mismatched tags before running the release matrix.
  preflight:
    name: Verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      npm-tag: ${{ steps.release.outputs.npm-tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested version $EXPECTED_VERSION does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            PUBLISH_TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "Manual publishing requires a version tag." >&2
              exit 1
            fi
            PUBLISH_TAG="$REF_NAME"
          else
            echo "Unsupported publish event $EVENT_NAME." >&2
            exit 1
          fi

          if [ "$PUBLISH_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Publish tag $PUBLISH_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi
          if ! grep -F "## [$PACKAGE_VERSION] - " CHANGELOG.md | grep -Eq '^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Changelog is missing release notes for $PACKAGE_VERSION." >&2
            exit 1
          fi

          # Registry lookup fails closed on network errors or malformed responses.
          PUBLISHED_VERSIONS="$(npm view "$PACKAGE_NAME" versions --json --registry=https://registry.npmjs.org)"
          PUBLISHED_VERSIONS="$PUBLISHED_VERSIONS" PACKAGE_VERSION="$PACKAGE_VERSION" node <<'NODE'
          let versions;
          try {
            const response = JSON.parse(process.env.PUBLISHED_VERSIONS);
            versions = typeof response === "string" ? [response] : response;
          } catch {
            console.error("Could not verify the npm version history.");
            process.exit(1);
          }
          if (!Array.isArray(versions) || !versions.every((version) => typeof version === "string")) {
            console.error("Could not verify the npm version history.");
            process.exit(1);
          }
          if (versions.includes(process.env.PACKAGE_VERSION)) {
            console.error("Package version is already published on npm.");
            process.exit(1);
          }
          NODE

          if [[ "$PACKAGE_VERSION" == *-* || "$RELEASE_PRERELEASE" == "true" ]]; then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

  # Re-run the complete Linux, Windows, macOS, packed-runtime, and agent-host matrix on the tag.
  verify:
    name: Validate tagged release
    needs: preflight
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      id-token: write

  # Publish only after the exact tagged source passes every release gate.
  publish:
    name: Publish to npm
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      # Use an immutable action revision without retaining repository credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Configure the release runtime and npm registry used by Trusted Publishing.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Bun owns dependency installation and repository validation scripts.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Reproduce the lockfile without executing dependency lifecycle scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Stop publication when the locked dependency graph has known vulnerabilities.
      - name: Audit dependencies
        run: bun run audit

      # Re-run the complete repository gate against the exact tagged source.
      - name: Run project checks
        run: bun run check

      # Publish without lifecycle scripts and attach npm provenance from the OIDC identity.
      - name: Publish package
        env:
          NPM_TAG: ${{ needs.preflight.outputs.npm-tag }}
        run: npm publish --ignore-scripts --access public --provenance --tag "$NPM_TAG"
