name: Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Source checks and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun run audit

      - name: Run project checks
        run: bun run check

      - name: Archive validated build
        run: tar -czf package-build.tar.gz dist types

      - name: Upload validated build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build
          path: package-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  packed-runtime:
    name: Packed runtime (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 20
          - os: macos-latest
            node-version: 22

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Download validated build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-build

      - name: Extract validated build
        run: tar -xzf package-build.tar.gz

      - name: Validate packed runtime
        run: bun run package:validate

  agent-compatibility:
    name: Agent compatibility (${{ matrix.label }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: OpenCode latest
            agent: opencode
            host_package: opencode-ai
            host_version: latest
          - label: OpenCode 1.18.14
            agent: opencode
            host_package: opencode-ai
            host_version: 1.18.14
          - label: pi latest
            agent: pi
            host_package: "@earendil-works/pi-coding-agent"
            host_version: latest
          - label: pi 0.81.1
            agent: pi
            host_package: "@earendil-works/pi-coding-agent"
            host_version: 0.81.1
          - label: Copilot CLI latest
            agent: copilot
            host_package: "@github/copilot"
            host_version: latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Copilot terminal tools
        if: matrix.agent == 'copilot'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux util-linux

      - name: Download validated build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-build

      - name: Extract validated build
        run: tar -xzf package-build.tar.gz

      - name: Install real agent host
        env:
          HOST_PACKAGE: ${{ matrix.host_package }}
          HOST_VERSION: ${{ matrix.host_version }}
        run: |
          set -euo pipefail
          HOST_ROOT="$RUNNER_TEMP/codex-limits-host"
          npm install \
            --prefix "$HOST_ROOT" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$HOST_PACKAGE@$HOST_VERSION"
          echo "HOST_ROOT=$HOST_ROOT" >> "$GITHUB_ENV"

      - name: Pack Codex Limits
        id: package
        run: |
          set -euo pipefail
          PACK_OUTPUT="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP")"
          PACKAGE_FILENAME="$(node -e 'const chunks=[]; process.stdin.on("data", c => chunks.push(c)); process.stdin.on("end", () => process.stdout.write(JSON.parse(Buffer.concat(chunks))[0].filename));' <<< "$PACK_OUTPUT")"
          echo "tarball=$RUNNER_TEMP/$PACKAGE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Exercise packed integration in real host
        env:
          AGENT: ${{ matrix.agent }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          bun run agents:compat \
            --agent "$AGENT" \
            --host-root "$HOST_ROOT" \
            --package-tarball "$PACKAGE_TARBALL"
